[platformio]
default_envs = esp32_ReflowPlate_Dev_DE

[esp32_ReflowPlate_Dev]
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 230400
platform = espressif32@7.1.3

[env:esp32_ReflowPlate_Dev_DE]
extends = esp32_ReflowPlate_Dev
build_flags =-DUI_LANG=LANG_DE

[env:esp32_ReflowPlate_Dev_EN]
extends = esp32_ReflowPlate_Dev
build_flags =-DUI_LANG=LANG_EN

[env:esp32_ReflowPlate_Dev_PL]
extends = esp32_ReflowPlate_Dev
build_flags =-DUI_LANG=LANG_PL